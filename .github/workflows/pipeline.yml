name: CI, release, and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f compose.yaml -f compose.vps.yaml config --quiet

  publish:
    name: Publish immutable image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      version: ${{ steps.identity.outputs.version }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute build identity
        id: identity
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          base_version=$(node --print "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="${base_version}-dev.${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "commit_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            APP_COMMIT_SHA=${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to memora_vps
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: antlysis-loyalty-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://antlysis-loyalty.axelyn.com
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ needs.publish.outputs.image }}
      VERSION: ${{ needs.publish.outputs.version }}
      COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/antlysis_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/antlysis_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload deployment configuration
        shell: bash
        run: |
          tar -czf - compose.yaml compose.vps.yaml deploy/vps-deploy.sh \
            | ssh -i "$HOME/.ssh/antlysis_deploy" debian@15.235.209.68 \
                'tar -xzf - -C /opt/antlysis-loyalty && chmod 0755 /opt/antlysis-loyalty/deploy/vps-deploy.sh'

      - name: Pull and deploy exact image
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | ssh -i "$HOME/.ssh/antlysis_deploy" debian@15.235.209.68 \
                'docker login ghcr.io --username aminhaiqal --password-stdin'
          ssh -i "$HOME/.ssh/antlysis_deploy" debian@15.235.209.68 \
            "/opt/antlysis-loyalty/deploy/vps-deploy.sh '$IMAGE' '$VERSION' '$COMMIT_SHA'"

      - name: Log out of GHCR on VPS
        if: always()
        run: ssh -i "$HOME/.ssh/antlysis_deploy" debian@15.235.209.68 'docker logout ghcr.io >/dev/null 2>&1 || true'

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
