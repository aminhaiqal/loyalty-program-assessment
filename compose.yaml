x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-loyalty}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-loyalty_program}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
  PORT: 3000
  CLIENT_ORIGIN: ${COMPOSE_CLIENT_ORIGIN:-http://localhost:3000}
  UPLOAD_DIR: /app/uploads
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  APP_VERSION: ${APP_VERSION:-dev}
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyalty_program}
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app-init:
    image: ${APP_IMAGE:-loyalty-program:local}
    command:
      - sh
      - -c
      - node server/src/scripts/apply-schema.js && node server/src/scripts/seed-admin.js
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  app:
    image: ${APP_IMAGE:-loyalty-program:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
    environment: *app-environment
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - receipt_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  receipt_uploads:
